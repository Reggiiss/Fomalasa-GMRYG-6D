<html>
<head>
<title>Datos del Alumno</title>
<style>
<body> {
width: 100%;
margin: 0;
height: 100%;
background-color: #f4faf3;
font-family: Arial, sans-serif;
color: #2b2b2b;
}
.titulo {
text-align: center;
padding: 35px 20px 10px;
border-bottom: 1px solid #c5e8bf;
}
.titulo h1 {
font-size: 2.2rem;
color: #bf4e8b;
margin-bottom: 4px;
}
.titulo p {
font-size: 0.82rem;
color: #666;
text-transform: uppercase;
letter-spacing: 0.1em;
}
.cuerpo {
max-width: 500px;
margin: 40px auto;
padding: 0 20px 60px;
}
.tarjeta {
background: #fff;
border: 1px solid #c5e8bf;
border-top: 4px solid #3d7a33;
border-radius: 6px;
overflow: hidden;
}
.fila {
display: flex;
justify-content: space-between;
align-items: center;
padding: 14px 20px;
border-bottom: 1px solid #eaf4e8;
}
.fila:last-child {
border-bottom: none;
}
.fila:nth-child(even) {
background-color: #f4faf3;
}
.clave {
font-size: 0.78rem;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.08em;
color: #3d7a33;
}
.valor {
font-size: 0.93rem;
font-weight: 600;
color: #2b2b2b;
text-align: right;
}
</style>
</head>
<body>

<div class="titulo">
<h1><b>Datos del Alumno</b></h1>
<p>FOMALASA &mdash; DGETI</p>
</div>

<div class="cuerpo">
<div class="tarjeta">
<div class="fila">
<span class="clave">Nombre</span>
<span class="valor">Gomez Munoz Regina Yaretzi Guadalupe</span>
</div>
<div class="fila">
<span class="clave">Grado</span>
<span class="valor">6</span>
</div>
<div class="fila">
<span class="clave">Grupo</span>
<span class="valor">D</span>
</div>
<div class="fila">
<span class="clave">Especialidad</span>
<span class="valor">Ofimatica</span>
</div>
</div>
</div>



</body>
</html>
